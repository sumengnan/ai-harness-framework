name: Tests

# 只作为可复用 workflow 存在，由 ci.yml（master / PR）和 release.yml（发布前）调用。
# 单独抽出来是因为：被调用的 workflow 不能申请超出调用方的权限，
# 而打 tag 需要 contents: write —— 让 tag job 留在 ci.yml 里就没这个冲突。
on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      # setup-uv 不发布浮动 major 标签（最高只到 v7），这里钉具体版本
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked：uv.lock 与 pyproject.toml 不一致时直接失败，而不是悄悄改锁
      # --all-extras：内核的可选依赖（memory / mcp / browser…）都要覆盖到
      - name: Install
        run: uv sync --locked --all-extras --python ${{ matrix.python-version }}

      - name: Test
        run: uv run --no-sync pytest -q
