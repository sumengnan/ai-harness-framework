name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # 供 release.yml 复用：发布前先跑同一套测试
  workflow_call:

# 同一分支上新的 push 取消旧的运行；master 上不取消，保证每个提交都有结论
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked：uv.lock 与 pyproject.toml 不一致时直接失败，而不是悄悄改锁
      # --all-extras：内核的可选依赖（memory / mcp / browser…）都要覆盖到
      - name: Install
        run: uv sync --locked --all-extras --python ${{ matrix.python-version }}

      - name: Test
        run: uv run --no-sync pytest -q
